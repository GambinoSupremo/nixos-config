[bar.default]
# Solid theme-coloured strip: logo + workspaces | clock | status icons.
background_opacity = 1.0
compositor_blur = false
capsule = false
start = [ "control-center", "workspaces" ]
center = [ "weather", "clock", "caffeine" ] # equal-width icons keep the clock dead centre
end = [ "gav/status:dictating", "media", "privacy", "notifications", "tray", "network", "cpu", "gav/status:update", "theme", "volume" ] # volume stays far right
color = "on_surface"
font_weight = 400
margin_edge = 0
margin_ends = 0
radius = 0
padding = 8
widget_spacing = 16
scale = 0.90000000596046448
thickness = 26
shadow = false
contact_shadow = false
[config]

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

# Night light follows the real sunset/sunrise for the auto-located city.
[location]
custom_schedule = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-4", "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 0.0
    box_width = 0.0
    cx = 1920.0
    cy = 2037.0
    output = "DP-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-4"]
    box_height = 0.0
    box_width = 0.0
    cx = 1720.0
    cy = 1317.0
    output = "DP-4"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-4".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

[nightlight]
enabled = true

[notification]
position = "top_center" # under the clock
# Small pings (Claude replies, screenshots, ...) toast but skip the bell history.
filter_order = [ "claude-code", "claude-floating", "claude-app", "ghostty", "screenshot", "satty", "recorder", "copy-text", "qr-code", "convert", "theme", "font", "web-apps", "spotify", "sone" ]

    [notification.filter.claude-code]
    match = "com.claude.code"
    save_history = false

    [notification.filter.claude-floating]
    match = "com.claude.floating"
    save_history = false

    [notification.filter.claude-app]
    match = "claude"
    save_history = false

    [notification.filter.ghostty]
    match = "com.mitchellh.ghostty"
    save_history = false

    [notification.filter.screenshot]
    match = "screenshot"
    save_history = false

    [notification.filter.satty]
    match = "satty"
    save_history = false

    [notification.filter.recorder]
    match = "recorder"
    save_history = false

    [notification.filter.copy-text]
    match = "copy text"
    save_history = false

    [notification.filter.qr-code]
    match = "qr code"
    save_history = false

    [notification.filter.convert]
    match = "convert"
    save_history = false

    [notification.filter.theme]
    match = "theme"
    save_history = false

    [notification.filter.font]
    match = "font"
    save_history = false

    [notification.filter.web-apps]
    match = "web apps"
    save_history = false

    [notification.filter.spotify]
    match = "spotify"
    save_history = false

    [notification.filter.sone]
    match = "sone"
    save_history = false

[osd]
background_opacity = 0.89999997988343239
offset_x = 8.0
scale = 0.85000000521540642

    # No toast on mic mute/unmute (PTT flips it constantly); bar icon stays.
    [osd.kinds]
    volume_input = false

[shell]
avatar_path = "/home/gav/.face"
settings_show_advanced = true
telemetry_enabled = false

    [shell.panel]
    open_near_click_control_center = true
    open_near_click_session = true
    open_near_click_wallpaper = true

    # Region capture → Satty for annotation (satty config in home/apps/programs.nix).
    [shell.screenshot]
    freeze_screen = true
    pipe_to_command = true
    pipe_command = "satty --filename -"
    save_to_file = false
    copy_to_clipboard = false

[theme]
builtin = "Gruvbox"
community_palette = "Tokyo Night Moon"
source = "wallpaper"

    [theme.templates]
    # Installed apps only; a missing app's template fails on every theme change.
    builtin_ids = [
        "btop",
        "gtk3",
        "gtk4",
        "ghostty",
        "hyprland",
        "kcolorscheme",
        "niri",
        "qt",
        "starship"
    ]
    community_ids = [
        "claude-code",
        "sone",
        "pywalfox",
        "zen-browser",
        "discord",
        "obsidian",
        "zed",
        "heroiclauncher",
        "obs",
        "lazygit",
        "neovim",
        "spicetify-noctalia"
    ]

    # App themes Noctalia has no community template for.
    [theme.templates.user.papirus]
    input_path = "~/.config/noctalia/templates/papirus-accent"
    output_path = "~/.cache/noctalia/papirus-accent"
    post_hook = "papirus-accent"

    # Community tmux one edits tmux.conf, which home-manager owns; this just reloads.
    [theme.templates.user.tmux]
    input_path = "~/.config/noctalia/templates/tmux.conf"
    output_path = "~/.config/tmux/themes/noctalia.conf"
    post_hook = "tmux source-file -q ~/.config/tmux/themes/noctalia.conf 2>/dev/null || true"

[wallpaper]
directory = "/home/gav/Pictures/themes"

    [wallpaper.automation]
    enabled = true
    interval_seconds = 1800  # v5 key (was interval_minutes)
    recursive = true         # images live in subfolders

    [wallpaper.default]
    path = "/home/gav/Pictures/themes/gruvbox/a_painting_of_a_man_with_a_dripping_face.jpg"

    [wallpaper.last]
    path = "/home/gav/Pictures/themes/gruvbox/a_painting_of_a_man_with_a_dripping_face.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/gav/Pictures/themes/gruvbox/a_painting_of_a_man_with_a_dripping_face.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/gav/Pictures/themes/gruvbox/a_painting_of_a_man_with_a_dripping_face.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/gav/Pictures/themes/gruvbox/a_painting_of_a_man_with_a_dripping_face.jpg"

    [wallpaper.monitors.DP-4]
    path = "/home/gav/Pictures/themes/gruvbox/a_painting_of_a_man_with_a_dripping_face.jpg"

    [wallpaper.monitors.WAYLAND-1]
    path = "/home/gav/Pictures/themes/gruvbox/a_painting_of_a_man_with_a_dripping_face.jpg"

[weather]
address = "Kirkland, WA"
unit = "imperial"

# Accent touches: logo, current workspace and clock take the theme's main colour.
[widget.clock]
color = "primary"
format = "{:%A %H:%M}"

[widget.control-center]
color = "primary"
custom_image = "/run/current-system/sw/share/icons/hicolor/scalable/apps/nix-snowflake-white.svg"
custom_image_colorize = true

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "none"
show_value = false

    # Click opens btop.
    [widget.cpu.actions]
    left = "exec ghostty --gtk-single-instance=false -e btop"

[widget.network]
show_label = false

[widget.privacy]
hide_inactive = true

[widget.volume]
show_label = false

[widget.notifications]
hide_when_no_unread = true

# Palette button: click = Style menu, scroll = next/previous theme, right click = back to wallpaper colors.
[widget.theme]
type = "custom_button"
glyph = "palette"
tooltip = "Style (scroll to change theme)"
scroll_repeat = "gesture"

    [widget.theme.actions]
    left = "exec sysmenu style"
    right = "exec theme Wallpaper"
    scroll_up = "exec theme prev"
    scroll_down = "exec theme next"

[widget.tray]
drawer = true

# Icon only; hover for details.
[widget.weather]
show_condition = false
show_temperature = false

[widget.workspaces]
label_source = "name"
style = "regular"
active_pill_size = 2.2
inactive_pill_size = 1.2
hide_when_empty = false
separator = " "
focused_color = "primary"
occupied_color = "on_surface"
empty_color = "on_surface_variant"

# System menu icons and on-only status icons (home/desktop/noctalia/plugins).
[plugins]
enabled = ["gav/sysmenu", "gav/status"]
