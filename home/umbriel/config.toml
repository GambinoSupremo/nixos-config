# Mango reference. Includes: Noctalia palette, HM games.toml, Sunshine's runtime stream.toml.
[include.optional]
files = ["noctalia.toml", "games.toml", "stream.toml"]

[environment]
TERMINAL = "ghostty"
QT_QPA_PLATFORMTHEME = "qt6ct"

[general]
show_cheatsheet = false
focus_on_activate = false
autostart = ["@BOOTSTRAP@", "gsettings set org.gnome.desktop.interface color-scheme prefer-dark", "wl-paste --watch cliphist store", "sleep 5 && mullvad-exclude vesktop", "sleep 5 && signal-desktop --password-store=gnome-libsecret", "sleep 5 && tidal-hifi"]

[appearance]
border_width = 2
corner_radius = 6
prefer_no_csd = true

[appearance.title_bar]
mode = "off"

# Mango: shadows on floating windows only (rule below), size 10 / blur 15.
[appearance.shadow]
enabled = true
softness = 15
offset_x = 0
offset_y = 0

[appearance.blur]
enabled = true
optimized = true
passes = 2
radius = 5
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.2

[input.keyboard]
layout = "us"
repeat_rate = 25
repeat_delay = 600
numlock_toggle = true

[input.mouse]
accel_profile = "flat"

[input.cursor]
theme = "Bibata-Modern-Ice"
size = 24
follows_focus = true

[input.focus]
follows_mouse = true

# Mango curves and durations; focus/border changes are instant there.
[animation.beziers]
mango = [0.46, 1.0, 0.29, 1.0]
mangoclose = [0.08, 0.92, 0.0, 1.0]

[animation.windows_in]
style = "zoom"
scale = 0.4
duration_ms = 400
curve = "mango"

[animation.windows_out]
style = "zoom"
duration_ms = 100
curve = "mangoclose"

[animation.windows_move]
duration_ms = 500
curve = "mango"

[animation.windows_resize]
duration_ms = 500
curve = "mango"

[animation.workspaces]
duration_ms = 350
curve = "mango"

[animation.border]
enabled = false

[animation.windows_opacity]
enabled = false

[layout]
mode = "dwindle"
gap = 5
extent_presets = [0.5, 0.7, 1.0]

[layout.struts]
left = 10
right = 10
top = 10
bottom = 10

[layout.master]
new_becomes_master = true
default_width_fraction = 0.5

[layout.scrolling]
default_extent_fraction = 0.5
center_focused = "never"
center_underfull_strip = false

[output."Dell Inc. Dell AW3423DW #tBszGDAYBQUH"]
mode = "3440x1440@174"
position = [0, 0]
scale = 1.0
workspaces = 6
cyclic_workspaces = true
workspace_axis = "vertical"
vrr = "disabled"
hdr = "off"

[output."Philips Consumer Electronics Company PHL 278E1 0x0000065F"]
mode = "3840x2160@60"
position = [3440, 0]
scale = 1.5
workspaces = 6
cyclic_workspaces = true
workspace_axis = "vertical"
vrr = "disabled"
hdr = "off"

[[workspace]]
index = 2
output = "Dell Inc. Dell AW3423DW #tBszGDAYBQUH"
layout.mode = "scrolling"

[[workspace]]
index = 3
output = "Dell Inc. Dell AW3423DW #tBszGDAYBQUH"
layout.mode = "scrolling"

[[workspace]]
index = 4
output = "Dell Inc. Dell AW3423DW #tBszGDAYBQUH"
layout.mode = "scrolling"

[[workspace]]
index = 5
output = "Dell Inc. Dell AW3423DW #tBszGDAYBQUH"
layout.mode = "scrolling"

[[workspace]]
index = 6
output = "Dell Inc. Dell AW3423DW #tBszGDAYBQUH"
layout.mode = "scrolling"

[[scratchpad]]
name = "terminal"
spawn_when_empty = "ghostty --gtk-single-instance=false --class=com.ghostty.scratchpad"

[[scratchpad]]
name = "stash"

[keybinds]
"Mod+Escape" = "spawn noctalia msg panel-toggle session"
"Mod+Return" = "spawn ghostty"
"Mod+Ctrl+Return" = "spawn ghostty --gtk-single-instance=false --class=com.ghostty.floating"
"Mod+space" = "spawn noctalia msg panel-toggle launcher"
"Mod+Shift+b" = "spawn zen-beta"
"Mod+Shift+e" = "spawn nautilus"
"Mod+Shift+d" = "spawn mullvad-exclude vesktop"
"Mod+Shift+o" = "spawn obsidian"
"Mod+Shift+m" = "spawn tidal-hifi"
"Mod+Shift+Alt+b" = "spawn zen-beta --private-window"
"Mod+Shift+i" = "spawn zeditor"
"Mod+backslash" = "spawn noctalia msg panel-toggle control-center audio"
"Mod+Alt+e" = "spawn noctalia msg panel-open launcher /emo"
"Mod+Alt+w" = "spawn noctalia msg panel-toggle wallpaper"
"Mod+Alt+p" = "spawn noctalia msg panel-toggle clipboard"
"Mod+Alt+r" = "spawn systemctl --user restart noctalia.service"
"Alt+Shift+s" = "spawn grim -g \"$(slurp)\" - | wl-copy"
"Mod+Shift+s" = "spawn noctalia msg screenshot-region"
"Print" = "spawn noctalia msg screenshot-region"
"XF86AudioPlay" = "spawn playerctl play-pause"
"XF86AudioNext" = "spawn playerctl next"
"XF86AudioPrev" = "spawn playerctl prev"
"XF86AudioRaiseVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86AudioMute" = "spawn wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
"Mod+q" = { action = "window-close", repeat = false }
"Ctrl+Alt+Delete" = "session-quit"
"Mod+Shift+Alt+r" = "config-reload"
"Mod+t" = "layout-toggle-split"
"Mod+w" = "window-toggle-floating"
"Mod+f" = "window-toggle-fullscreen"
"Mod+m" = "window-toggle-maximize-to-edges"
"Mod+Shift+g" = "window-toggle-pinned"
"Mod+Tab" = "overview-toggle"
"Mod+n" = "workspace-set-layout toggle scrolling dwindle master"
"Mod+Ctrl+s" = "workspace-set-layout scrolling"
"Mod+Ctrl+a" = "workspace-set-layout master"
"Mod+Ctrl+d" = "workspace-set-layout dwindle"
"Mod+r" = "window-cycle-primary-extent"
"Alt+e" = "window-set-primary-extent 1.0"
"Alt+Tab" = "window-focus-next"
"Alt+Shift+Tab" = "window-focus-previous"
"Alt+z" = "scratchpad-toggle terminal"
"Alt+Shift+z" = "window-move-to-scratchpad stash"
"Alt+Ctrl+z" = "scratchpad-toggle stash"
"Mod+equal" = "window-modify-primary-extent +0.02"
"Mod+minus" = "window-modify-primary-extent -0.02"
"Mod+Shift+equal" = "window-modify-secondary-extent +0.02"
"Mod+Shift+minus" = "window-modify-secondary-extent -0.02"
"Mod+WheelUp" = "workspace-previous"
"Mod+WheelDown" = "workspace-next"
"Mod+Left" = "window-focus-left"
"Mod+Shift+Left" = "window-swap-left"
"Mod+Ctrl+Left" = "output-focus-left"
"Mod+Ctrl+Alt+Left" = "window-move-to-output-left"
"Mod+h" = "window-focus-left"
"Mod+Shift+h" = "window-swap-left"
"Mod+Ctrl+h" = "output-focus-left"
"Mod+Ctrl+Alt+h" = "window-move-to-output-left"
"Mod+Right" = "window-focus-right"
"Mod+Shift+Right" = "window-swap-right"
"Mod+Ctrl+Right" = "output-focus-right"
"Mod+Ctrl+Alt+Right" = "window-move-to-output-right"
"Mod+l" = "window-focus-right"
"Mod+Shift+l" = "window-swap-right"
"Mod+Ctrl+l" = "output-focus-right"
"Mod+Ctrl+Alt+l" = "window-move-to-output-right"
"Mod+Up" = "window-focus-up"
"Mod+Shift+Up" = "window-swap-up"
"Mod+Ctrl+Up" = "workspace-previous"
"Mod+Ctrl+Alt+Up" = "window-move-to-workspace-previous"
"Mod+k" = "window-focus-up"
"Mod+Shift+k" = "window-swap-up"
"Mod+Ctrl+k" = "workspace-previous"
"Mod+Ctrl+Alt+k" = "window-move-to-workspace-previous"
"Mod+Down" = "window-focus-down"
"Mod+Shift+Down" = "window-swap-down"
"Mod+Ctrl+Down" = "workspace-next"
"Mod+Ctrl+Alt+Down" = "window-move-to-workspace-next"
"Mod+j" = "window-focus-down"
"Mod+Shift+j" = "window-swap-down"
"Mod+Ctrl+j" = "workspace-next"
"Mod+Ctrl+Alt+j" = "window-move-to-workspace-next"
"Mod+1" = "workspace-switch 1"
"Mod+Ctrl+1" = "window-move-to-workspace-silent 1"
"Mod+2" = "workspace-switch 2"
"Mod+Ctrl+2" = "window-move-to-workspace-silent 2"
"Mod+3" = "workspace-switch 3"
"Mod+Ctrl+3" = "window-move-to-workspace-silent 3"
"Mod+4" = "workspace-switch 4"
"Mod+Ctrl+4" = "window-move-to-workspace-silent 4"
"Mod+5" = "workspace-switch 5"
"Mod+Ctrl+5" = "window-move-to-workspace-silent 5"
"Mod+6" = "workspace-switch 6"
"Mod+Ctrl+6" = "window-move-to-workspace-silent 6"

[[window_rule]]
blur = true

[[window_rule]]
match.is_floating = false
shadow = false

[[window_rule]]
match.is_scratchpad = true
default_floating_size = { width = 0.8, height = 0.9 }

[[window_rule]]
match.is_focused = false
opacity = 0.98

[[window_rule]]
match.app_id = "^com\\.ghostty\\.floating$"
default_floating = true
default_floating_size_px = { width = 900, height = 600 }

[[window_rule]]
match.app_id = "^com\\.gabm\\.satty$"
default_floating = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^(vesktop|signal|Signal|tidal-hifi)$"
default_output = "Philips Consumer Electronics Company PHL 278E1 0x0000065F"
default_workspace = 2
default_focused = false

[[window_rule]]
match.app_id = "^(signal|vesktop|tidal-hifi|cider|obsidian)$"
match.is_focused = false
opacity = 0.9

[[window_rule]]
match.app_id = "^(signal|vesktop|tidal-hifi|cider|obsidian)$"
match.is_focused = true
opacity = 0.95

[[window_rule]]
match.app_id = "^zen-beta$"
opacity = 1.0

[[window_rule]]
match.app_id = '^com\.gabm\.satty$'
default_floating_size = { width = 0.7, height = 0.7 }

[[window_rule]]
match.app_id = '^(steam|steam_app_.*|.*\.exe)$'
default_scrolling_extent = 1.0
